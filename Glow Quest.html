<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Glow Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: single centered column on a night-sky ground. Welcome (artwork + player form) > Home (level cards) > Lesson > Quiz > Result. One look, taken from the Glow artwork: midnight indigo, violet glow, pink accents. */
:root{
  --bg:#0b0720; --bg2:#150d36; --surface:#1a1145; --line:#43348c;
  --violet:#a78bfa; --violet-deep:#6d3fd9; --lav:#d9ccff; --pink:#ff7ac6; --pink-deep:#e8359b;
  --ink:#f4efff; --muted:#aa9ed6; --on-pink:#34082a;
  --good:#6ee7b0; --good-soft:#0f3a2e; --bad:#ff9db1; --bad-soft:#4a1630;
  --glow-a:#3b2390; --glow-b:#25134f; --glow-soft:rgba(139,92,246,.22); --pink-glow:rgba(255,95,176,.38);
  --display:'Fredoka','Trebuchet MS',sans-serif; --body:'Nunito','Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:radial-gradient(800px 460px at 85% -8%,var(--glow-a),transparent 62%),radial-gradient(640px 400px at 0% 18%,var(--glow-b),transparent 60%),var(--bg);
  color:var(--ink);font:400 16px/1.55 var(--body);padding-block:18px 56px;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.18}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.wm{font:700 32px/1 var(--display);letter-spacing:.02em;color:var(--pink);background:linear-gradient(90deg,var(--pink),var(--lav));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:flex;align-items:baseline;gap:8px}
.wm small{font:600 12px var(--display);letter-spacing:.35em;color:var(--lav);-webkit-text-fill-color:var(--lav)}
.ghost{background:transparent;border:2px solid var(--line);color:var(--lav);border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.ghost:hover{border-color:var(--violet)}
.go{background:linear-gradient(180deg,var(--pink),var(--pink-deep));color:var(--on-pink);border:0;border-radius:999px;padding:11px 22px;font:600 17px var(--display);box-shadow:0 0 22px var(--pink-glow)}
.go:hover{filter:brightness(1.07)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 0 34px var(--glow-soft)}
.card h2{font-size:23px}
.hero{width:100%;border-radius:24px;border:1.5px solid var(--line);box-shadow:0 0 40px var(--glow-soft);display:block}
label{display:flex;flex-direction:column;gap:6px;font-weight:800;color:var(--lav)}
input{background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:17px;width:100%}
input:focus{border-color:var(--pink);outline:none}
.fields{display:grid;grid-template-columns:1fr 130px;gap:12px}
.err{color:var(--bad);font-weight:800;min-height:1.4em}
.saved{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12px;font-weight:800;border-radius:999px;padding:3px 11px;background:var(--bg2);color:var(--lav);border:1px solid var(--line)}
.chip.g{color:var(--pink);border-color:var(--pink-deep)}
.glowie{display:flex;gap:12px;align-items:flex-start;background:var(--bg2);border:1.5px solid var(--violet-deep);border-radius:20px;padding:14px 16px}
.orb{flex:none;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6f4,var(--pink) 55%,var(--pink-deep));box-shadow:0 0 20px var(--pink-glow);display:grid;place-items:center;font-size:22px}
.glowie small{display:block;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);font-size:11px}
.glowie p{font-weight:600}
.lvl{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center;box-shadow:0 0 30px var(--glow-soft)}
.ico{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;background:var(--bg2);border:2px solid var(--violet-deep);box-shadow:0 0 18px var(--glow-soft)}
.badges{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.bd{font-size:13px;font-weight:800;border-radius:999px;padding:5px 12px;background:var(--bg2);border:1.5px dashed var(--line);color:var(--muted)}
.bd.on{border:1.5px solid var(--pink);color:var(--ink);box-shadow:0 0 16px var(--pink-glow)}
.score .srow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.lab{font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--muted)}
.num{font:700 36px/1.1 var(--display);color:var(--pink);font-variant-numeric:tabular-nums}
.num span{font-size:18px;color:var(--muted)}
.rank{font:600 18px var(--display)}
.champ{display:flex;gap:12px;align-items:center;border:1.5px dashed var(--line);border-radius:18px;padding:10px 14px;color:var(--muted);min-width:0}
.champ strong{display:block;font:600 18px var(--display)}
.champ span{font-size:14px}
.crown{font-size:36px;filter:grayscale(1);opacity:.5}
.champ.on{border:1.5px solid var(--pink);color:var(--ink);box-shadow:0 0 24px var(--pink-glow)}
.champ.on .crown,.champwin .crown{filter:none;opacity:1}
.thanks{color:var(--lav);font-weight:700}
.praise{width:100%;border-radius:20px;padding:16px;background:linear-gradient(135deg,var(--bg2),var(--glow-a));border:1.5px solid var(--pink);box-shadow:0 0 26px var(--pink-glow);display:flex;flex-direction:column;gap:6px;align-items:center}
.praise .cf{font-size:30px;letter-spacing:.2em}
.praise p{font-weight:700}
.champwin{width:100%;border:2px solid var(--pink);border-radius:20px;padding:18px;background:var(--bg2);box-shadow:0 0 34px var(--pink-glow);display:flex;flex-direction:column;align-items:center;gap:8px}
.champwin .crown{font-size:64px}
.tiers{display:flex;flex-direction:column;gap:8px}
.tier{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700}
.tier span:first-child{font-size:26px}
.tier em{font-style:normal;color:var(--pink);font-weight:800;margin-left:auto;white-space:nowrap}
.lvl .tag{font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--pink)}
.lvl h3{font-size:20px}
.lvl .desc{grid-column:1/-1;color:var(--muted);font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.act{display:flex;gap:10px;align-items:center}
.medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--bg2);border:2px dashed var(--line);color:var(--muted)}
.medal.on{border:2px solid var(--pink);box-shadow:0 0 18px var(--pink-glow)}
.lesson li{list-style:none;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.lesson ul{margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.lesson .e{font-size:24px;line-height:1.3}
.remember{background:var(--bg2);border:1.5px solid var(--pink-deep);border-radius:16px;padding:12px 16px;font:600 18px var(--display);color:var(--pink);text-align:center}
.bar{display:flex;align-items:center;gap:12px}
.track{flex:1;height:14px;border-radius:99px;background:var(--bg2);border:1px solid var(--line);overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--violet-deep),var(--pink));transition:width .3s}
.time{font:600 22px var(--display);font-variant-numeric:tabular-nums;min-width:64px;text-align:right;color:var(--lav)}
.time.low{color:var(--bad)}
.ans{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;text-align:left;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:600;width:100%}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--pink);border:1.5px solid var(--violet-deep);display:grid;place-items:center;font-family:var(--display)}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{border-radius:16px;padding:12px 14px;font-weight:600}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--bad-soft)}
.fb strong{display:block;font:600 19px var(--display)}
.big{align-items:center;text-align:center}
.big .medal{width:120px;height:120px;font-size:64px;border-style:solid}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pad{margin-top:4px}
@media(max-width:480px){.lvl{grid-template-columns:1fr}.fields{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

const LEVELS=[{"level": 1, "name": "Glow Beginner", "difficulty": "Easy", "time": "3 mins", "focus": "Passwords & Account Setup", "goldBadge": "Gold Shield", "silverBadge": "Silver Shield", "bronzeBadge": "Bronze Shield", "tip": "Welcome! You have 3 minutes to lock your digital front door with strong passwords."}, {"level": 2, "name": "Glow Explorer", "difficulty": "Mild", "time": "4 mins", "focus": "Phishing & Safe Surfing", "goldBadge": "Gold Inspector", "silverBadge": "Silver Inspector", "bronzeBadge": "Bronze Inspector", "tip": "Spot the tricks! 4 minutes on the clock—check links carefully before you click."}, {"level": 3, "name": "Glow Shield", "difficulty": "Moderate", "time": "5 mins", "focus": "Cyberbullying & Well-being", "goldBadge": "Gold Guardian", "silverBadge": "Silver Guardian", "bronzeBadge": "Bronze Guardian", "tip": "You control your space! You have 5 minutes to solve these real-world scenarios."}, {"level": 4, "name": "Glow Leader", "difficulty": "Advanced", "time": "5 mins", "focus": "Fake News & Leadership", "goldBadge": "Gold Leader", "silverBadge": "Silver Leader", "bronzeBadge": "Bronze Leader", "tip": "Final challenge! Show your leadership skills and spot misinformation before time runs out."}], MODULES=[{"name": "LEARN", "tagline": "Digital Basics & Safety", "desc": "Foundational skills for navigating the digital world safely."}, {"name": "EXPLORE", "tagline": "Knowledge & Opportunity", "desc": "Safe ways to discover positive content, interests, and opportunities online."}, {"name": "STAY SAFE", "tagline": "Privacy & Security", "desc": "Essential tools and practices to protect your data, accounts, and privacy."}, {"name": "BE STRONG", "tagline": "Confidence & Well-being", "desc": "Building mental resilience, positive self-talk, and digital wellness."}], QUIZ={"young": [{"level": 1, "text": "Which password is the strongest?", "options": ["Purple-Rocket-Tiger-42!", "sunny123", "mypassword"], "a": 0, "fb": "Long, mixed-up words with a number and a symbol make a super strong lock. 🔐"}, {"level": 1, "text": "Who is it OK to tell your password to?", "options": ["A parent or trusted grown-up", "Your whole class", "Anyone who asks nicely"], "a": 0, "fb": "Passwords are secrets. Only a trusted grown-up should ever help with them. 🤫"}, {"level": 1, "text": "What is a safe picture for your game profile?", "options": ["A cartoon or animal picture", "A photo of your school", "A photo of your front door"], "a": 0, "fb": "Great choice! A cartoon keeps your real life private. 🦄"}, {"level": 1, "text": "A game asks for your home address to sign up. What do you do?", "options": ["Stop and ask a grown-up", "Type it in quickly", "Ask a friend to type it"], "a": 0, "fb": "Smart! Never share your address online without a grown-up. 🏠"}, {"level": 1, "text": "What is 2FA (two-step login)?", "options": ["A second step, like a code, to prove it is really you", "Two passwords you share with a friend", "A game for two players"], "a": 0, "fb": "It's like a second lock on your door. Double the safety! 🔒"}, {"level": 2, "text": "A pop-up says \"You won a free game! Click here!\" What do you do?", "options": ["Close it and tell a grown-up", "Click it right away", "Type your name and address"], "a": 0, "fb": "Free prize pop-ups are almost always tricks. Well done! 🎁"}, {"level": 2, "text": "A stranger sends you a link for free gems. What is the best move?", "options": ["Don't click, and tell a trusted adult", "Click to see what it is", "Send it to your friends"], "a": 0, "fb": "Never click links from people you don't know. 🔗"}, {"level": 2, "text": "Someone in a game asks where you live. What do you do?", "options": ["Say no, block them and tell a grown-up", "Tell them your street", "Tell them just your city"], "a": 0, "fb": "Shields up! Keep your location secret from online strangers. 🛡️"}, {"level": 2, "text": "What does the little padlock next to a website name tell you?", "options": ["Your connection to the site is private", "The site is just for kids", "The site is free"], "a": 0, "fb": "Look for the padlock. It shows your connection is protected. 🔒"}, {"level": 2, "text": "You want a new game. What is the safest way to get it?", "options": ["Ask a grown-up and use the official app store", "Click any download button you see", "Open a link from a message"], "a": 0, "fb": "Official stores check their apps. Always ask first! 📲"}, {"level": 3, "text": "Someone writes a mean comment on your drawing. What is a good move?", "options": ["Block them, tell a grown-up and keep creating", "Write something mean back", "Delete all your art"], "a": 0, "fb": "You keep shining! Mean comments are never your fault. 🎨"}, {"level": 3, "text": "A friend gets mean messages in a group chat. What can you do?", "options": ["Be kind to her and tell a trusted adult", "Laugh along", "Do nothing"], "a": 0, "fb": "You are a true friend and an upstander! 💜"}, {"level": 3, "text": "You have been on a screen for a long time and feel tired. What now?", "options": ["Take a break, drink water and play outside", "Keep going for one more hour", "Stay up all night"], "a": 0, "fb": "Breaks help your brain and body glow. 🌳"}, {"level": 3, "text": "Someone online says, \"Keep our chat a secret from your parents.\" What do you do?", "options": ["Tell a trusted adult right away", "Keep the secret", "Ask them to explain"], "a": 0, "fb": "Safe adults never ask kids to keep secrets like that. Telling is brave! 🦋"}, {"level": 3, "text": "A game has a Mute button. When is it great to use it?", "options": ["To quiet unkind players", "To be mean to someone", "To delete the game"], "a": 0, "fb": "Mute gives you peace and fun. 🔕"}, {"level": 4, "text": "A chat says \"Send this to 10 friends or something bad will happen!\" What do you do?", "options": ["Don't send it and ask a grown-up", "Send it to 10 friends", "Scare your friends"], "a": 0, "fb": "Chain messages are tricks. Stopping them is a hero move! 🦸"}, {"level": 4, "text": "Your friend wants to post a silly photo of you without asking. What do you say?", "options": ["\"Please ask me first!\"", "\"Sure, post anything\"", "Post one of her too"], "a": 0, "fb": "Everyone gets to decide about their own photos. 📸"}, {"level": 4, "text": "A video says a cat can talk like a person. How can you check it?", "options": ["Ask a grown-up and check a trusted website", "Share it right away", "Believe it because it's a video"], "a": 0, "fb": "Fact detectives always check first! 🔍"}, {"level": 4, "text": "You see something untrue online. What is a kind way to help?", "options": ["Tell a trusted adult or use the report button", "Shout at the person", "Copy it and share it"], "a": 0, "fb": "Kind and brave. Reporting helps everyone. 🌟"}, {"level": 4, "text": "What is a digital footprint?", "options": ["The trail of things you post and do online", "A footprint on your keyboard", "A level in a game"], "a": 0, "fb": "Like footprints in wet cement, it can stay a long time. Make yours great! 👣"}], "mid": [{"level": 1, "text": "Maya is creating a secret club account. Which password is safest?", "options": ["Maya2012", "P@ssw0rd123", "Purple-Galaxy-99#"], "a": 2, "fb": "Boom! Digital lock engaged! Random words + symbols create a fortress."}, {"level": 1, "text": "Why is it risky to use your pet's name and birth year as a password?", "options": ["Hackers can guess it from public social posts", "Computers will break down", "It uses too many numbers"], "a": 0, "fb": "Spot on! Keep personal clues out of your keys."}, {"level": 1, "text": "What is Two-Factor Authentication (2FA)?", "options": ["Having two accounts at once", "A second confirmation step like a text code or app prompt", "Sharing your password with two friends"], "a": 1, "fb": "Double lock security! Even if someone finds your password. They can't get in."}, {"level": 1, "text": "Your profile picture on a public gaming platform should ideally be:", "options": ["A clear selfie showing your face and school", "An avatar or cool graphic that doesn't reveal personal info", "A photo of your house exterior"], "a": 1, "fb": "Smart avatar choice! Keep your real-world landmarks private."}, {"level": 1, "text": "You are filling out a public game profile bio. Which detail is safe to share?", "options": ["Your home address and phone number", "Your favorite book genre and hobbies", "Your daily school schedule"], "a": 1, "fb": "Safe sharing! Hobbies are fun: private locations are locked down."}, {"level": 2, "text": "DM from 'Official_Admin' saying your account is banned. Action?", "options": ["Click link fast", "Reply asking for proof", "Ignore,block sender,check official settings"], "a": 2, "fb": "Smart thinking! Real security teams never send suspicious links DMs."}, {"level": 2, "text": "You see a pop-up saying: ''CONGRATS! You won a free tablet! Click here!''", "options": ["Click immediately to claim it", "Close the window safely", "Type your home address in the box"], "a": 1, "fb": "Bullet dodged! Free prize pop-ups are almost always traps."}, {"level": 2, "text": "What does HTTPS at the beginning of a website URL mean?", "options": ["The site is extra fun", "The connection is encrypted and secure", "The site is owned by your school"], "a": 1, "fb": "Secure connection verified! Always look for that 'S'."}, {"level": 2, "text": "A stranger adds you on a game and ask what city you live in. What do you do?", "options": ["Tell them your country only", "Answer honestly so you can play together", "Decline/block and do not share location"], "a": 2, "fb": "Shields up! Never give location hints to online strangers."}, {"level": 2, "text": "You want to download a new mod for a game, but it's on a sketchy,random website.", "options": ["Download it right away", "Ask a trusted adult or check official trusted stores first", "Turn off your antivirus"], "a": 1, "fb": "Wise choice! Sketchy download sites love hiding malware."}, {"level": 3, "text": "Someone leaves a mean comment on Maya's video project.", "options": ["Reply with a mean comment", "Delete comment, block user, keep posting", "Delete her entire account"], "a": 1, "fb": "Shields up! Block, report, and keep shining!"}, {"level": 3, "text": "A friend starts receiving hurtful messages in a group chat. What should Maya do?", "options": ["Laugh along so she doesn't get targeted", "Take screenshots as proof, support her friend, and report it", "Leave the app and ignore everything"], "a": 1, "fb": "True friend and ally! Document and report toxic behavior."}, {"level": 3, "text": "You notice you've been scrolling through social feeds for 3 straight hours feeling drained.", "options": ["Keep scrolling until midnight", "Take a mindful break, log off, and step outside", "Delete the phone entirely"], "a": 1, "fb": "Digital wellness win! Balance is everything."}, {"level": 3, "text": "Someone online is pressuring you to keep a \"secret\" chat from your parents", "options": ["Keep the secret to look mature", "Break the secret rule immediately and tell a trusted adult", "Tell your online friend you'll think about it"], "a": 1, "fb": "Zero tolerance for secrecy tricks! Adults who demand secrets from kids are unsafe."}, {"level": 3, "text": "How do you use the 'Mute' or 'Restrict' tool effectively?", "options": ["To secretly spy on people", "To quiet negative accounts without them knowing, protecting your peace", "To delete your own profile"], "a": 1, "fb": "Peace of mind activated! Curate your digital energy."}, {"level": 4, "text": "Shocking group chat alert asking to forward to 10 friends.", "options": ["Forward immediately", "Verify on trusted news sites", "Reply telling everyone to panic"], "a": 1, "fb": "Fact-checker activated! Verifying stops viral fake news in its tracks."}, {"level": 4, "text": "Friend wants to post an embarrassing photo without permission.", "options": ["Remind her content can be saved/screenshotted", "Tell her to delete after 1 hr", "Post without tagging name"], "a": 0, "fb": "Digital Leader move! Always respect privacy and ask before posting."}, {"level": 4, "text": "You see an incredible, unbelievable scientific discovery shared by a meme account", "options": ["Share it as absolute fact", "Check if reputable science news outlets confirm it", "Ignore science completely"], "a": 1, "fb": "Critical thinker! Memes are for laughs, not breaking news."}, {"level": 4, "text": "You want to stand up to misinformation online safely. What is a great approach?", "options": ["Start a massive argument in the comments", "Politely share a fact-checked link from a credible source or report the post", "Insult the person who posted it"], "a": 1, "fb": "Grace under fire! Lead with facts and kindness."}, {"level": 4, "text": "Why does your digital footprint matter for your future?", "options": ["It doesn't matter; things disappear instantly", "Colleges, future employers, and communities can view past posts", "It only affects your phone battery"], "a": 1, "fb": "Visionary mindset! Build a footprint you'll be proud of tomorrow"}], "t13": [{"level": 1, "text": "Your best friend asks for your password \"to prove we're close\". What is the best reply?", "options": ["Say no kindly. Real friends respect privacy", "Share it, she's your best friend", "Share it now and change it later"], "a": 0, "fb": "Friendships change, but a shared password gives access to your messages and photos. Keep it yours. 🔐"}, {"level": 1, "text": "What is the best way to set up account recovery?", "options": ["Add a recovery email and phone number only you control", "Use a friend's email so you won't forget", "Skip it, you'll remember"], "a": 0, "fb": "If you are ever locked out, only you should be able to get back in. 📧"}, {"level": 1, "text": "You are setting up a new social account. Which setting is the best start?", "options": ["A private account where you approve people you know", "A public account to get more followers", "Public, but with no photo"], "a": 0, "fb": "Start private and open up only if you choose to. 🔒"}, {"level": 1, "text": "A site wants your full name, birthday, school and phone number just to read an article. What do you do?", "options": ["Share only what is needed, or skip the site", "Fill in everything", "Use a friend's details"], "a": 0, "fb": "Only give what a site really needs. The rest stays yours. 🛡️"}, {"level": 1, "text": "Which username is safest for a public gaming profile?", "options": ["StarlightFox_77", "SaraAhmed_Grade8", "Sara_StMarys_2011"], "a": 0, "fb": "A made-up name hides your real name, school and birth year. 🎭"}, {"level": 2, "text": "A DM says you won a phone and only need to pay a small shipping fee. What do you do?", "options": ["Ignore it and report it, because real prizes don't ask for money", "Pay, it is only a small fee", "Share it so friends can enter"], "a": 0, "fb": "Prizes that ask you to pay first are scams. 🎁"}, {"level": 2, "text": "A poster has a QR code promising free data. What should you do first?", "options": ["Check the poster is official and where the link goes", "Scan it, QR codes are always safe", "Scan it and enter your number"], "a": 0, "fb": "QR codes can open fake sites, so check before you trust them. 📷"}, {"level": 2, "text": "A player in chat says, \"Download this file for free in-game currency.\" It ends in .exe. What is the risk?", "options": ["It could be malware that steals your accounts", "There is no risk, he's a gamer", "It will only slow your game"], "a": 0, "fb": "Files from strangers can hide malware. Never run them. 💾"}, {"level": 2, "text": "A flashlight app asks for your contacts, microphone and location. What do you do?", "options": ["Deny it and find a safer app", "Allow everything", "Allow only the microphone"], "a": 0, "fb": "Permissions should match the app's job. A flashlight needs none of those. 📱"}, {"level": 2, "text": "A pop-up says \"Your device has a virus! Call this number now!\" What does it want?", "options": ["To scare you into paying or giving access", "To help you fix your phone", "To update your system"], "a": 0, "fb": "Real warnings never ask you to call a number from a pop-up. ☎️"}, {"level": 3, "text": "A classmate makes a fake profile pretending to be you. What are the first steps?", "options": ["Screenshot it, report the profile and tell a trusted adult", "Make a fake profile of them", "Ignore it forever"], "a": 0, "fb": "Evidence plus reporting gets the profile removed. You are not alone. 🎭"}, {"level": 3, "text": "Your group chat jokes hurt one person and you feel uneasy. What can you do?", "options": ["Say it isn't okay and support her privately", "Join in to fit in", "Stay silent"], "a": 0, "fb": "Speaking up even once can change a whole chat. 👥"}, {"level": 3, "text": "Someone shares a private photo of your friend without her consent. What is right?", "options": ["Don't share it, report it and help her tell a trusted adult", "Show it to one friend", "Comment on it"], "a": 0, "fb": "Sharing private images hurts and can be against the law. Be the one who helps. 📵"}, {"level": 3, "text": "You compare your life to others online and feel left out. What helps?", "options": ["Remember posts are highlights, limit scrolling and talk to someone you trust", "Post more to look happier", "Unfollow all your friends"], "a": 0, "fb": "What you see online is the best moments, not the whole story. 🪞"}, {"level": 3, "text": "An online friend wants to move to a private app and asks you not to tell your parents. What do you do?", "options": ["Say no, stop chatting and tell a trusted adult", "Move, they seem nice", "Move but keep it secret"], "a": 0, "fb": "Safe friends never ask you to keep secrets from your family. 🚨"}, {"level": 4, "text": "A post says \"Doctors don't want you to know this trick!\" What is the red flag?", "options": ["Big secret claims with no sources", "It has pictures", "Lots of people liked it"], "a": 0, "fb": "Shocking claims without evidence are a warning sign. 🕵️"}, {"level": 4, "text": "Two websites give opposite facts. How do you decide?", "options": ["Check who runs each, their sources and other reliable outlets", "Pick the one with the nicer design", "Pick the one you agree with"], "a": 0, "fb": "Good thinkers check, not just choose. ⚖️"}, {"level": 4, "text": "An influencer promotes a product with #ad. What does that mean?", "options": ["They were paid or given something to promote it", "It is the best product", "The government approved it"], "a": 0, "fb": "Ads can be fine, but know when someone is paid. 💰"}, {"level": 4, "text": "Before posting a party photo of your friends, you should:", "options": ["Ask them if they are comfortable with it", "Post it, it is your photo", "Tag them first"], "a": 0, "fb": "Respecting consent is real leadership. 🤳"}, {"level": 4, "text": "How can you be a positive digital leader at school?", "options": ["Share kind posts, report harm and help classmates stay safe", "Ignore online problems", "Call people out in public"], "a": 0, "fb": "Leaders lift others up. 🌟"}], "teen": [{"level": 1, "text": "Which approach protects your accounts best?", "options": ["A unique passphrase for each account, kept in a password manager", "One strong password used everywhere", "Your usual password with one letter changed"], "a": 0, "fb": "A leak on one site can't unlock the others when every password is unique. 🔑"}, {"level": 1, "text": "For two-factor login, which is generally stronger?", "options": ["An authenticator app", "A code sent by SMS", "Having no second step"], "a": 0, "fb": "Text messages can be intercepted, for example by SIM-swapping. An app is harder to steal. 🔢"}, {"level": 1, "text": "You get a login alert from a country you've never visited. First step?", "options": ["Change your password, log out other devices and check 2FA", "Ignore it", "Reply to the alert with your password"], "a": 0, "fb": "Quick action shuts the door before anything is lost. 🚨"}, {"level": 1, "text": "A hacked friend's account sends you \"Is this you in this video?\" with a link. What do you do?", "options": ["Don't click, and warn them another way", "Click to see", "Forward it to others"], "a": 0, "fb": "Hacked accounts spread links to hack more accounts. Warning them helps everyone. 🧑‍💻"}, {"level": 1, "text": "Why be careful about logging in on public Wi-Fi?", "options": ["Others on the network may spy on unprotected traffic", "It makes your phone slower", "It deletes your saved logins"], "a": 0, "fb": "Use a trusted network or save sensitive logins for later. 📶"}, {"level": 2, "text": "An email says your streaming account closes in 24 hours unless you \"verify\". What are the red flags?", "options": ["Urgency, a link and a vague greeting", "It has a company logo", "It is sent during the day"], "a": 0, "fb": "Pressure plus a link is the classic phishing recipe. 🎣"}, {"level": 2, "text": "What is the safest way to check if a message from your bank or platform is real?", "options": ["Open the official app or type the website yourself", "Call the number in the message", "Reply and ask if it is real"], "a": 0, "fb": "Never trust contact details that came in the message itself. 📲"}, {"level": 2, "text": "A link shows \"paypa1-support.com\". What's wrong?", "options": ["It's a lookalike address using a 1 instead of an l", "Nothing, it looks fine", "It is too short"], "a": 0, "fb": "Scammers swap characters to fool fast readers. Slow down and zoom in. 🌐"}, {"level": 2, "text": "A \"free skins generator\" asks you to log in with your game account. What can happen?", "options": ["Scammers take over your account", "You get free skins", "Your level goes up"], "a": 0, "fb": "No real generator exists. They only want your login. 🎮"}, {"level": 2, "text": "Your browser warns that a site's certificate is invalid before you enter card details. What do you do?", "options": ["Leave the site without entering anything", "Click through anyway", "Refresh until the warning goes away"], "a": 0, "fb": "That warning means the connection may n function scoreCard(p){const pts=totalPts(p),n=LEVELS.filter(l=>p.progress[l.level]).length,all=doneAll(p);
return `<div class="card score"><div class="srow"><div><div class="lab">Total score</div><div class="num">⭐ ${pts}<span> / ${MAXPTS}</span></div><div class="rank">${titleFor(pts)}</div></div>
<div class="champ ${all?'on':''}"><div class="crown" aria-hidden="true">👑</div><div><strong>Glow Champion</strong><span>${all?'Unlocked! You are amazing! 🎉':'Earn a badge on all '+LEVELS.length+' levels ('+n+' of '+LEVELS.length+' so far)'}</span></div></div></div>
<div class="track" aria-hidden="true"><div class="fill" style="width:${Math.min(100,pts/MAXPTS*100)}%"></div></div>${all?'<p class="thanks">'+thanks(p)+'</p>':''}</div>`}
const PRAISE=['You locked your digital front door like a pro! 🔐','You can spot tricks and scams now. Nothing gets past you! 🕵️','You showed kindness and courage. You make the internet a safer place! 💜','You think like a true leader and fact detective! 🌟'];
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

function lesson(n){
  const p=me(),band=bandOf(p.age),l=LEVELS.find(x=>x.level===n),L=LESSONS[band][n-1];
  app.innerHTML=`<div class="top"><button class="ghost" id="bk">← Levels</button><span class="chip g">${ICONS[n-1]} Level ${n} · ${esc(l.name)}</span></div>
  <article class="card lesson"><span class="chip" style="align-self:flex-start">💡 Hints before you play</span>
  <h2>${ICONS[n-1]} ${esc(L.title)}</h2>
  <ul>${L.points.map(([e,t])=>`<li><span class="e" aria-hidden="true">${e}</span><span>${esc(t)}</span></li>`).join('')}</ul>
  <div class="remember">${esc(L.remember)}</div></article>
  <div class="card"><h2>🏅 Badges you can earn</h2><div class="tiers">${tiersHTML(l,secsFor(l,band))}</div><p style="color:var(--muted)">Finish all 5 questions before the clock runs out and you always earn a badge. The faster you finish, the better it is! ⚡ Each right answer is 10 points, and badges add bonus points: 🥇 +30, 🥈 +20, 🥉 +10.</p></div>
  <div class="glowie"><div class="orb">🌟</div><div><small>AI Glowie says</small><p>${esc(l.tip)} Your clock starts when you press the button, so read the hints first. ⏱ ${fmt(secsFor(l,band))}</p></div></div>
  <div class="row"><button class="go" id="rd">I'm ready! Start the quiz 🚀</button></div>`;
  document.getElementById('bk').onclick=home;
  document.getElementById('rd').onclick=()=>start(n);
}

function start(n){
  const p=me(),band=bandOf(p.age),lv=LEVELS.find(l=>l.level===n),secs=secsFor(lv,band);
  const qs=QUIZ[band].filter(q=>q.level===n).map(q=>({text:q.text,fb:q.fb,opts:shuffle(q.options.map((t,i)=>({t,ok:i===q.a})))}));
  st={lv,qs,i:0,score:0,left:secs,total:secs,done:false,picked:false};
  clearInterval(timer);
  timer=setInterval(()=>{st.left--;if(st.left<=0){st.left=0;clearInterval(timer);finish(true)}else tick()},1000);
  question();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function tick(){const t=document.getElementById('time');if(!t)return;t.textContent=fmt(st.left);t.classList.toggle('low',st.left<=30);document.getElementById('tl').setAttribute('aria-valuenow',st.left)}
function question(){
  const q=st.qs[st.i];st.picked=false;
  app.innerHTML=`<div class="top"><button class="ghost" id="quit">← Levels</button><span class="chip g">${ICONS[st.lv.level-1]} Level ${st.lv.level} · ${esc(st.lv.name)}</span></div>
  <div class="bar"><div class="track" id="tl" role="progressbar" aria-valuemin="0" aria-valuemax="${st.total}" aria-valuenow="${st.left}" aria-label="Time left"><div class="fill" style="width:${st.i/st.qs.length*100}%"></div></div><div class="time" id="time">${fmt(st.left)}</div></div>
  <div class="card"><span class="chip" style="align-self:flex-start">Question ${st.i+1} of ${st.qs.length}</span><h2>${esc(q.text)}</h2>
  <div class="ans">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><b>${'ABC'[k]}</b><span>${esc(o.t)}</span></button>`).join('')}</div>
  <div id="fb"></div></div>`;
  document.getElementById('quit').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  tick();
}
function answer(k){
  if(st.picked)return;st.picked=true;
  const q=st.qs[st.i],ok=q.opts[k].ok;if(ok)st.score++;
  app.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(q.opts[i].ok)b.classList.add('right');else if(i===k)b.classList.add('wrong')});
  const last=st.i===st.qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><strong>${ok?pick(YES):pick(NO)}</strong>${ok?'':`The best answer is “${esc(q.opts.find(o=>o.ok).t)}”. `}${esc(q.fb)}</div><div class="row" style="margin-top:14px"><button class="go" id="next">${last?'See my badge 🏅':'Next question ➜'}</button></div>`;
  const n=document.getElementById('next');n.focus();
  n.onclick=()=>{st.i++;last?finish(false):question()};
}
function finish(timeout){
  clearInterval(timer);st.done=true;
  const p=me(),s=st.score,n=st.qs.length,lv=st.lv.level;
  const used=st.total-st.left,c=cut(st.total);
  const badge=timeout?null:used<=c.gold?'gold':used<=c.silver?'silver':'bronze';
  const wasAll=doneAll(p);
  const pts=s*10+(badge?BONUS[badge]:0);
  p.scores=p.scores||{};
  if(pts>(p.scores[lv]||0))p.scores[lv]=pts;
  if(badge&&(!p.progress[lv]||rank[badge]>rank[p.progress[lv]]))p.progress[lv]=badge;
  const newChamp=!wasAll&&doneAll(p);
  save();
  const name=badge?st.lv[badge+'Badge']:null;
  const talk=badge==='gold'?'Lightning fast and super smart! You are glowing so bright! 🌟🎉':badge==='silver'?'Great speed! A little faster for Gold? ⚡':badge==='bronze'?'You completed the level! Replay to be quicker and climb higher. 🚀':timeout?'Time ran out before you finished. Finish all 5 questions in time to earn your badge. You can do it! 🌈':'Keep going! 💪';
  app.innerHTML=`<div class="top"><div class="wm">GLOW<small>GAME</small></div></div>
  <div class="card big">${timeout?`<h2>Time's up! ⏰</h2>`:`<div class="praise"><div class="cf" aria-hidden="true">🎉✨🌟💖🎊</div><h2>Well done, ${esc(p.name)}!</h2><p>${PRAISE[lv-1]}</p><p style="color:var(--pink)">${s<3?'You finished the level! Check the hints again to get more answers right. 💪':badge==='gold'?'A Gold finish. Incredible speed! 🥇':badge==='silver'?'A Silver finish. So quick! 🥈':'You completed Level '+lv+'. Every level makes you stronger! 🥉'}</p></div>`}
  <p style="color:var(--lav);font-weight:800">${esc(p.name)}, you got ${s} of ${n} right ${timeout?'before time ran out':'in '+fmt(used)}. ⏱</p>
  <div class="medal ${badge?'on':''}">${badge?MEDAL[badge]:'💫'}</div>
  <h2>${badge?'You earned the '+esc(name)+'!':'No badge this time'}</h2><div class="tiers" style="width:100%;text-align:left">${tiersHTML(st.lv,st.total)}</div>
  <p style="font-weight:800;color:var(--pink)">⭐ +${pts} points (${s} × 10${badge?' + '+BONUS[badge]+' badge bonus':''}). Total score: ${totalPts(p)} / ${MAXPTS}</p>
  ${newChamp?`<div class="champwin"><div class="crown" aria-hidden="true">👑</div><h2>Glow Champion unlocked!</h2><p>${thanks(p)}</p><p style="color:var(--pink);font-weight:800">You earned a badge on every level. Final rank: ${titleFor(totalPts(p))}</p></div>`:''}
  <div class="glowie" style="text-align:left;width:100%"><div class="orb">🌟</div><div><small>AI Glowie says</small><p>${talk}</p></div></div>
  <div class="row">${lv<LEVELS.length&&!timeout?'<button class="go" id="nx">Next level ➜</button>':''}<button class="${lv<LEVELS.length&&!timeout?'ghost':'go'}" id="again">Play again 🔁</button><button class="ghost" id="les">Read the hints</button><button class="ghost" id="home">All levels</button></div></div>`;
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>lesson(lv+1);
  document.getElementById('again').onclick=()=>start(lv);
  document.getElementById('les').onclick=()=>lesson(lv);
  document.getElementById('home').onclick=home;
}
if(db.current&&db.players[db.current])home();else welcome();
</script>

</body></html>
